<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der Igel – Bären</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
/* VOICE: warm, ruhig, kindgerecht – Bilder und Stimme statt Lesen
   IDEA: ein Laubhaufen-Bilderbuch, in dem jedes Bild spricht
   PICTURE: großer gezeichneter Igel zum Antippen, Bildkarten
   COLOUR: Herbstlaub-Beige, Moosgrün für richtig, Laub-Orange als Akzent; Silben blau/rot
   TYPE: Century Gothic (Questrial als Ersatz), große Knöpfe; LAYOUT: eine Spalte, Raster */
:root{color-scheme:light dark;
--bg:light-dark(#fbf6f1,#1d1813);--card:light-dark(#ffffff,#2a231c);--ink:light-dark(#1f1a17,#f3e9dc);
--soft:light-dark(#ecd3c4,#4a3428);--fr:light-dark(#dfa98f,#8a5a44);--or:#c0643f;--ok:#3f8a3a;--no:#c8372d;--sb:var(--ink);--sr:light-dark(#d3261f,#ff7a70)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Century Gothic","CenturyGothic","Questrial",AppleGothic,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--or);outline-offset:3px}
header{display:flex;align-items:center;gap:10px;padding:10px max(3vw,12px);position:sticky;top:0;background:var(--or);z-index:5}
header h1,header h1 span{color:#fff!important}
header h1{flex:1;margin:0;font-size:clamp(22px,4vw,32px);font-weight:700;text-align:center}
.rb{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:30px;box-shadow:0 3px 0 var(--soft)}
.rb:active{transform:translateY(2px);box-shadow:none}
main{max-width:1000px;margin:0 auto;padding:16px max(3vw,12px) 40px}
.s-b{color:var(--sb)}.s-r{color:var(--sr)}
.hidden{display:none!important}
/* Start */
.start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;min-height:70vh}
.start img{width:min(100%,300px);justify-self:center;animation:bob 3s ease-in-out infinite}
.bubble{background:var(--card);border-radius:28px;padding:22px;font-size:24px;position:relative;box-shadow:0 4px 0 var(--soft)}
.big{display:inline-flex;align-items:center;gap:12px;background:var(--or);color:#fff;font-size:28px;font-weight:700;padding:16px 30px;border-radius:999px;box-shadow:0 5px 0 #8a4127;margin-top:18px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4127}
/* Menü */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{background:var(--card);border-radius:24px;padding:14px 10px 12px;text-align:center;box-shadow:0 5px 0 var(--soft);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--soft)}
.tile .pic{font-size:64px;line-height:1.1}
.circ{display:inline-grid;place-items:center;border-radius:50%;background:#fff;border:3px solid var(--fr);width:var(--d,96px);height:var(--d,96px)}.circ img{width:74%;height:74%;object-fit:contain}
.tile .circ{--d:96px}.learn .card .circ{--d:112px}.q .qpic .circ{--d:clamp(150px,36vw,210px)}.opt .circ{width:100%;height:auto;aspect-ratio:1.25;border-radius:20px;border-width:2px}.opt .circ img{width:88%;height:80%}
.tile,.learn .card,.q,.say,.bubble,.fig{border:3px solid var(--fr)}
.tile .lbl{font-size:20px;font-weight:700}
.tile .st{font-size:18px;min-height:24px;letter-spacing:1px}
.tile.on{outline:5px solid var(--or)}
.hint{display:flex;gap:12px;align-items:center;margin:0 0 16px}
.hint img{width:70px;flex:none}
.hint .bubble{font-size:19px;padding:12px 16px;flex:1}
/* Igel */
.fig{background:#fff;border-radius:28px;box-shadow:0 5px 0 var(--soft);padding:8px}
.fig svg{width:100%;height:auto;display:block;max-height:58vh}
.part{cursor:pointer}
.part.hi{filter:drop-shadow(0 0 6px #e0784a) drop-shadow(0 0 2px #c0643f)}.part.hi path,.part.hi rect,.part.hi polygon{fill:#f6d3c2}
.part.bad{filter:drop-shadow(0 0 6px var(--no))}
.say{margin-top:14px;background:var(--card);border-radius:22px;padding:14px 18px;font-size:24px;min-height:70px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 0 var(--soft)}
.say .e{font-size:40px}
/* Quiz */
.q{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 5px 0 var(--soft);text-align:center}
.q .qt{font-size:26px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.q .qpic{font-size:clamp(90px,22vw,150px);line-height:1.15;margin:10px 0}
.q .qname{font-size:28px;font-weight:700}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.yn button,.opt{background:var(--bg);border-radius:24px;padding:14px;font-size:30px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--soft);border:4px solid transparent}
.yn .sym{font-size:56px;line-height:1}
.yn .ja .sym{color:var(--ok)}.yn .nein .sym{color:var(--no)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.opt{font-size:clamp(46px,11vw,72px);line-height:1.15;padding:18px 6px}
.right{border-color:var(--ok)!important;background:light-dark(#dff0d8,#1f3a1c)!important}
.wrong{border-color:var(--no)!important;animation:shake .4s}
.prog{display:flex;justify-content:center;gap:6px;margin:6px 0 14px;font-size:26px}
.fb{margin-top:16px;font-size:22px;min-height:34px}
.next{margin-top:12px}
.done{text-align:center}
.done img{width:200px;animation:bob 2s ease-in-out infinite}
.done .flw{display:flex;justify-content:center;align-items:flex-end;min-height:220px;margin-top:8px}.tile .st{min-height:46px;display:flex;align-items:flex-end}
.learn .card{background:var(--card);border-radius:24px;padding:14px;text-align:center;box-shadow:0 5px 0 var(--soft)}
.learn .card .pic{font-size:72px;line-height:1.15}
.learn .card .lbl{font-size:21px;font-weight:700}
.learn .card.on{border-color:var(--or);border-width:5px}
.x{position:relative;display:inline-block}
.x::after{content:"";position:absolute;left:-6%;right:-6%;top:48%;height:8px;background:var(--no);border-radius:4px;transform:rotate(-30deg)}
.bot{display:flex;justify-content:center;margin-top:22px}
.tempo{font-size:15px;opacity:.8;text-align:center;margin-top:28px}
.tempo button{background:var(--card);padding:8px 14px;border-radius:999px;margin:4px;box-shadow:0 2px 0 var(--soft);font-size:15px}
.tempo button.sel{background:var(--or);color:#fff}

.dot{cursor:pointer}.dot .dc{fill:#e02020;stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease-in-out infinite}
.dot.ok .dc{fill:var(--ok);animation:none}
.cnt{display:flex;justify-content:center;gap:8px;margin-top:12px}.cd{width:22px;height:22px;border-radius:50%;background:#e02020;opacity:.35}.cd.ok{background:var(--ok);opacity:1}
.pulse{animation:pop 1s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:600px){.start{grid-template-columns:1fr;text-align:center}.start img{width:180px}.bubble{font-size:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.opts{gap:8px}.rb{width:52px;height:52px;font-size:26px}}
</style>
</head>
<body>
<header>
  <button class="rb" id="home" aria-label="Zum Menü">🏠</button>
  <h1 id="ttl">Der I<span>gel</span></h1>
  <button class="rb" id="again" aria-label="Noch einmal vorlesen">🔊</button>
</header>
<main id="app"></main>

  quiz:[['🌲','der Wald',1,'Ja! Der I|gel lebt am Wald.'],['🌊','das Meer',0,'Nein. Im Meer lebt kein I|gel.'],['🏡','der Gar|ten',1,'Ja! Der I|gel lebt im Gar|ten.'],['🏜️','die Wüs|te',0,'Nein. In der Wüs|te lebt un|ser I|gel nicht.'],['🌳','der Park',1,'Ja! Der I|gel lebt im Park.'],['🛣️','die Au|to|bahn',0,'Nein. Dort ist es zu ge|fähr|lich.'],['🌿','die He|cke',1,'Ja! In der He|cke ver|steckt sich der I|gel.']]},
 {id:'hilfe',n:'Die Hil|fe',p:'💚',intro:'So kannst du dem I|gel hel|fen. Tip|pe auf die Bil|der.',
  learn:[['🍂','der Laub|hau|fen','Lass Laub lie|gen. Dort kann der I|gel schla|fen.'],['🏠','das I|gel|haus','In ei|nem I|gel|haus kann der I|gel Win|ter|schlaf hal|ten.'],['💧','das Was|ser','Stell an hei|ßen Ta|gen ei|ne Scha|le Was|ser hin.'],['🥛','kei|ne Milch','Gib dem I|gel nie|mals Milch. Davon wird er krank.',1]],
  qq:'Hilft das dem I|gel?',
  quiz:[['🍂','Laub lie|gen las|sen',1,'Ja! Im Laub kann der I|gel schla|fen.'],['🥛','Milch ge|ben',0,'Nein! Milch macht den I|gel krank.'],['💧','Was|ser hin|stel|len',1,'Ja! Was|ser hilft dem I|gel.'],['🍞','Brot ge|ben',0,'Nein. Brot ist nicht gut für den I|gel.'],['🏠','ein I|gel|haus',1,'Ja! Im I|gel|haus ist der I|gel si|cher.'],['🧹','al|les Laub weg|fe|gen',0,'Nein. Dann fin|det der I|gel kein Ver|steck.']]}
];
/* ---------- Igel-Zeichnung ---------- */
function igelSVG(dots){
 const cx=242,cy=178,rx=128,ry=112;let sp='';const N=40;
 for(let i=0;i<=N;i++){const a=Math.PI*(1.07+i/N*0.86),k=i%2?1:1.1;sp+=`${i?'L':'M'}${(cx+Math.cos(a)*rx*k).toFixed(1)} ${(cy+Math.sin(a)*ry*k).toFixed(1)} `}
 sp+='L356 206 Q250 236 140 214 Z';
 let fur='';for(let y=86;y<206;y+=15)for(let x=128;x<370;x+=17){const xx=x+((y/15)%2)*8,dx=(xx-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy>0.78||y>200||xx<150)continue;const ang=Math.atan2(dy,dx),l=11;fur+=`<line x1="${xx}" y1="${y}" x2="${(xx+Math.cos(ang)*l).toFixed(1)}" y2="${(y+Math.sin(ang)*l).toFixed(1)}"/>`}
 const S='stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
 return `<svg viewBox="0 0 420 280" role="img" aria-label="Igel">
 <ellipse cx="225" cy="262" rx="170" ry="10" fill="#000" opacity=".1"/>
 <g class="part" data-p="pfoten"><path d="M300 206 v34 q0 10 12 10 h18 q10 0 8 -10 l-4 -34z" fill="#fff" ${S}/><path d="M118 204 v28 h36 v-28z" fill="#fff" ${S}/></g>
 <g class="part" data-p="stacheln"><path d="${sp}" fill="#fff" ${S}/><g stroke="#000" stroke-width="2" stroke-linecap="round">${fur}</g></g>
 <g class="part" data-p="schwanz"><path d="M352 186 q22 -6 30 4 q-10 8 -30 6z" fill="#fff" ${S}/><circle cx="370" cy="186" r="20" fill="transparent"/></g>
 <g class="part" data-p="schnauze"><path d="M168 120 Q118 128 44 168 Q30 180 44 190 Q100 214 170 214 Q186 168 168 120Z" fill="#fff" ${S}/><circle cx="38" cy="179" r="10" fill="#000"/><circle cx="35" cy="175" r="3" fill="#fff"/><path d="M58 196 q16 6 30 2" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/></g>
 <g class="part" data-p="tasthaare" stroke="#000" stroke-width="2" stroke-linecap="round"><line x1="54" y1="180" x2="20" y2="160"/><line x1="54" y1="185" x2="12" y2="186"/><line x1="54" y1="190" x2="20" y2="210"/><g stroke="transparent" stroke-width="18"><line x1="54" y1="180" x2="20" y2="160"/><line x1="54" y1="185" x2="12" y2="186"/><line x1="54" y1="190" x2="20" y2="210"/></g></g>
 <g class="part" data-p="auge"><ellipse cx="100" cy="158" rx="8" ry="9" fill="#000"/><circle cx="102.5" cy="154.5" r="2.6" fill="#fff"/><circle cx="100" cy="158" r="20" fill="transparent"/></g>
 <g class="part" data-p="ohr"><path d="M128 134 q2 -24 20 -22 q8 14 -6 28z" fill="#fff" ${S}/><path d="M134 131 q3 -11 10 -11 q2 7 -4 13z" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="142" cy="126" r="20" fill="transparent"/></g>
 <g class="part" data-p="krallen"><path d="M114 232 h44 q4 10 -4 12 h-36 q-8 -2 -4 -12z" fill="#fff" ${S}/><g stroke="#000" stroke-width="3" stroke-linecap="round"><line x1="122" y1="244" x2="118" y2="254"/><line x1="131" y1="245" x2="129" y2="256"/><line x1="140" y1="245" x2="140" y2="256"/><line x1="149" y1="244" x2="152" y2="254"/></g><circle cx="136" cy="248" r="22" fill="transparent"/></g>
 ${dots?DOTS.map(d=>`<g class="dot" data-p="${d[0]}"><circle cx="${d[1]}" cy="${d[2]}" r="16" fill="transparent"/><circle class="dc" cx="${d[1]}" cy="${d[2]}" r="9"/></g>`).join(''):''}
 </svg>`}
const DOTS=[['stacheln',260,100],['ohr',141,121],['auge',100,138],['schnauze',70,174],['tasthaare',22,172],['pfoten',320,226],['krallen',136,264],['schwanz',372,180]];
/* ---------- Ansichten ---------- */
const hint=t=>`<div class="hint"><img src="${BEAR}" alt=""><div class="bubble">${sil(t)}</div></div>`;
function setT(t){ttl.innerHTML=sil(t)}
function start(){setT('Der I|gel');
 app.innerHTML=`<div class="start"><img src="${BEAR}" alt="Bär"><div><div class="bubble">${sil('Hal|lo! Ich bin der Bär. Heu|te ler|nen wir den I|gel ken|nen. Tip|pe auf 🔊, dann le|se ich dir vor.')}</div><button class="big" id="go">Los ➜</button></div></div>`;
 document.getElementById('go').onclick=()=>{say('Hal|lo! Heu|te ler|nen wir den I|gel ken|nen. Tip|pe auf ein Bild.');menu(true)}}
function menu(quiet){setT('Der I|gel');
 app.innerHTML=hint('Tip|pe auf ein Bild.')+`<div class="grid">${TOPICS.map((t,i)=>`<button class="tile" data-i="${i}"><span class="pic">${pic(t.p)}</span><span class="lbl">${sil(t.n)}</span></button>`).join('')}</div>
 <div class="tempo">Vorlese-Tempo: <button data-r="0.7">langsam</button><button data-r="0.85">mittel</button><button data-r="1">normal</button></div>`;
 if(!quiet)say('Tip|pe auf ein Bild.');
 app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const t=TOPICS[+b.dataset.i];say(t.n);setTimeout(()=>learn(t),150)});
 app.querySelectorAll('.tempo button').forEach(b=>{if(+b.dataset.r===rate)b.classList.add('sel');b.onclick=()=>{rate=+b.dataset.r;try{localStorage.setItem('igelRate',rate)}catch(e){}menu(true);say('So schnell le|se ich vor.')}})}
function quizBtn(){return `<div class="bot"><button class="big" id="qz">💡 Quiz</button></div>`}
function learn(t){setT(t.n);window.scrollTo(0,0);
 if(t.body){
  app.innerHTML=hint(t.intro)+`<div class="fig">${igelSVG(true)}</div><div class="cnt" id="cnt">${DOTS.map(()=>'<span class="cd"></span>').join('')}</div><div class="say" id="say"><span class="e">👆</span><span>${sil('Tip|pe auf die ro|ten Punk|te.')}</span></div>`+quizBtn();
  const seen=new Set();
  const open=id=>{const b=BODY.find(x=>x.id===id),g=app.querySelector(`.part[data-p="${id}"]`);app.querySelectorAll('.part').forEach(x=>x.classList.remove('hi'));g.classList.add('hi');
   const d=app.querySelector(`.dot[data-p="${id}"]`);if(d)d.classList.add('ok');seen.add(id);
   app.querySelectorAll('#cnt .cd').forEach((c,i)=>c.classList.toggle('ok',i<seen.size));
   document.getElementById('say').innerHTML=`<span class="e">🔊</span><span><b>${sil(b.n)}</b><br>${sil(b.t)}</span>`;say(b.t);
   if(seen.size===DOTS.length&&!open.done){open.done=1;tone(1);document.getElementById('qz').classList.add('pulse');say('Su|per! Du hast al|le Kör|per|tei|le ge|fun|den. Jetzt tip|pe auf Quiz.',1)}};
  app.querySelectorAll('.dot').forEach(d=>d.onclick=e=>{e.stopPropagation();open(d.dataset.p)});
  app.querySelectorAll('.part').forEach(g=>g.onclick=()=>open(g.dataset.p));
 }else{
  app.innerHTML=hint(t.intro)+`<div class="grid learn">${t.learn.map((l,i)=>`<button class="card" data-i="${i}"><div class="pic">${l[3]?`<span class="x">${pic(l[0])}</span>`:pic(l[0])}</div><div class="lbl">${sil(l[1])}</div></button>`).join('')}</div><div class="say" id="say"><span class="e">👆</span><span>${sil('Tip|pe auf ein Bild.')}</span></div>`+quizBtn();
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const l=t.learn[+c.dataset.i];app.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on');document.getElementById('say').innerHTML=`<span class="e">🔊</span><span>${sil(l[2])}</span>`;say(l[2])});
 }
 say(t.intro);
 document.getElementById('qz').onclick=()=>quiz(t)}
function quiz(t){window.scrollTo(0,0);setT(t.n.replace(/^(Das|Die|Der) /,'')+' – Quiz');
 let items;
 if(t.body)items=shuffle(BODY).map(b=>({kind:'tap',q:'Tip|pe auf '+b.n+'.',id:b.id,fb:'Rich|tig! Das ist '+b.n+'.'}));
 else if(t.pick)items=t.pick.map(p=>({kind:'pick',pic:p[0],q:p[1],opts:shuffle(p[2]),fb:p[3]}));
 else items=shuffle(t.quiz).map(x=>({kind:'yn',pic:x[0],name:x[1],ok:x[2],q:t.qq,fb:x[3]}));
 let k=0,err=0;
 const show=()=>{if(k>=items.length)return done(t,err);
  const it=items[k];let tries=0;
  const prog=`<div class="prog">${items.map((_,i)=>i<k?'🟠':i===k?'🦔':'⚪').join('')}</div>`;
  const qline=`<div class="qt"><button class="rb" id="rq" aria-label="Frage vorlesen">🔊</button><span>${sil(it.q)}</span></div>`;
  let body='';
  if(it.kind==='tap')body=`<div class="fig">${igelSVG()}</div>`;
  if(it.kind==='yn')body=`<div class="qpic">${pic(it.pic)}</div><div class="qname">${sil(it.name)}</div><div class="yn"><button class="ja" data-v="1"><span class="sym">✓</span>Ja</button><button class="nein" data-v="0"><span class="sym">✗</span>Nein</button></div>`;
  if(it.kind==='pick')body=`<div class="qpic">${pic(it.pic)}</div><div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}">${pic(o[0])}</button>`).join('')}</div>`;
  app.innerHTML=prog+`<div class="q">${qline}${body}<div class="fb" id="fb"></div><div id="nx"></div></div>`;
  const spoken=it.kind==='yn'?plain(it.name)+'. '+it.q:it.q;
  say(spoken);document.getElementById('rq').onclick=()=>say(spoken);
  const fb=document.getElementById('fb'),nx=document.getElementById('nx');let locked=false;
  const good=el=>{locked=true;tone(1);el.classList.add('right');fb.innerHTML=sil(it.fb);say(it.fb);
   nx.innerHTML=`<button class="big next" id="nb"><span>${sil('Wei|ter')}</span> ➜</button>`;document.getElementById('nb').onclick=()=>{k++;show()}};
  const bad=(el,msg)=>{tries++;err++;tone(0);el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),600);fb.innerHTML=sil(msg);say(msg)};
  if(it.kind==='tap')app.querySelectorAll('.part').forEach(g=>g.onclick=()=>{if(locked)return;const b=BODY.find(x=>x.id===g.dataset.p);
   if(g.dataset.p===it.id){g.classList.add('hi');good(app.querySelector('.q'))}else{g.classList.add('bad');setTimeout(()=>g.classList.remove('bad'),700);bad(app.querySelector('.fig'),'Das ist '+b.n+'. Ver|such es noch ein|mal.')}});
  if(it.kind==='yn')app.querySelectorAll('.yn button').forEach(b=>b.onclick=()=>{if(locked)return;if(+b.dataset.v===it.ok)good(b);else bad(b,'Hmm, nicht ganz. Ver|such es noch ein|mal.')});
  if(it.kind==='pick')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;const o=it.opts[+b.dataset.i];if(o[2])good(b);else bad(b,o[1]+' Nein, das stimmt nicht. Ver|such es noch ein|mal.')});
 };show()}
function done(t,err){tone(1);
 app.innerHTML=`<div class="done"><img src="${BEAR}" alt="Bär"><div class="bubble">${sil('Su|per, du hast es ge|schafft!')}</div><div class="bot"><button class="big" id="bk">🏠 <span>${sil('Zum Me|nü')}</span></button></div><div class="bot"><button class="rb" id="rp" aria-label="Quiz nochmal">🔁</button></div></div>`;
 say('Su|per, du hast es ge|schafft!');
 document.getElementById('bk').onclick=()=>menu();document.getElementById('rp').onclick=()=>quiz(t)}
document.getElementById('home').onclick=()=>menu();
if(!('speechSynthesis'in window))app.insertAdjacentHTML('beforebegin','<p style="text-align:center;color:var(--no)">Dieses Gerät kann leider nicht vorlesen.</p>');
start();
}
</script>
</body>
</html>
